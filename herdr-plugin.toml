id = "shelf"
name = "Shelf"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Archive agent tabs that have been inactive for days, and restore them with their conversation resumed."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "-m", "shelf", "sweep", "--if-due"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-m", "shelf", "track"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "shelf", "track"]

[[events]]
on = "workspace.focused"
command = ["python3", "-m", "shelf", "sweep", "--if-due"]

[[actions]]
id = "restore"
title = "Shelf: restore an archived tab"
contexts = ["global"]
command = ["python3", "-m", "shelf", "open-picker"]

[[actions]]
id = "archive-tab"
title = "Shelf: archive this tab"
contexts = ["tab"]
command = ["python3", "-m", "shelf", "open-archive"]

[[actions]]
id = "sweep-now"
title = "Shelf: sweep now"
contexts = ["global"]
command = ["python3", "-m", "shelf", "sweep"]

[[panes]]
id = "picker"
title = "Shelf"
placement = "popup"
width = "80%"
height = 18
command = ["python3", "-m", "shelf", "pick"]

[[panes]]
id = "archive-confirm"
title = "Shelf"
placement = "popup"
width = 64
height = 8
command = ["python3", "-m", "shelf", "confirm-archive"]
